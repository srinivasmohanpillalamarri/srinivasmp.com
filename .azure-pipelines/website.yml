# srinivasmp.com (Next.js static export) → C:\projects\srinivasmp.com
#
# Own IIS site at the domain root, so there is no NEXT_BASE_PATH to thread
# through and no base-path guard.
#
# TLS is live (Certera cert, expires 8 Feb 2027). The HTTP→HTTPS redirect is
# written into web.config here rather than clicked into IIS Manager, so it is
# version-controlled and survives a server rebuild.
#
# Server prerequisites (one-time):
#   1. IIS site exists, physical path = $(deployPath)
#   2. URL Rewrite module installed — https://www.iis.net/downloads/microsoft/url-rewrite
#      Without it the redirect rule is skipped (see the guard in "Write web.config").

trigger:
  branches:
    include: [main]
  paths:
    include:
      - next-app/**
      - .azure-pipelines/website.yml

# Self-hosted agent pool for this site. The agent must run on the server that
# hosts srinivasmp.com, so the deploy step can robocopy straight to deployPath.
#
# TODO: set the agent pool name.
pool: REPLACE-WITH-YOUR-POOL-NAME

variables:
  - name: workingDir
    value: '$(Build.SourcesDirectory)\next-app'
  - name: deployPath
    value: 'C:\projects\srinivasmp.com'
  - name: siteUrl
    value: 'https://srinivasmp.com'

jobs:
  - job: build_and_deploy
    displayName: Build and deploy
    timeoutInMinutes: 20          # a hung deploy should fail, not run all night
    workspace:
      clean: outputs

    steps:
      - checkout: self
        clean: false

      - task: NodeTool@0
        displayName: Use Node 22
        inputs:
          versionSpec: '22.x'

      # ── Build ──────────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: Build static export
        inputs:
          targetType: inline
          workingDirectory: '$(workingDir)'
          script: |
            $ErrorActionPreference = 'Stop'

            # Remove any out/ left by a previous run. Without this a failed
            # build can silently deploy the last successful one.
            if (Test-Path 'out') { Remove-Item 'out' -Recurse -Force }

            # 'npm ci' not 'npm install': a deploy should be reproducible.
            # If this fails on a lock mismatch, commit the lockfile.
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed ($LASTEXITCODE)" }

            npm run build
            if ($LASTEXITCODE -ne 0) { throw "next build failed ($LASTEXITCODE)" }

      # ── Guards ─────────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: Verify build output
        inputs:
          targetType: inline
          workingDirectory: '$(workingDir)'
          script: |
            $ErrorActionPreference = 'Stop'

            foreach ($f in @(
              'out\index.html', 'out\404.html',
              'out\og.png', 'out\icon.png', 'out\resume.pdf',
              'out\robots.txt', 'out\sitemap.xml', 'out\llms.txt'
            )) {
              if (-not (Test-Path $f)) { throw "Missing expected file: $f" }
            }

            # next/font self-hosts the Manrope and Fraunces woff2 files. If they
            # stop emitting, the site silently falls back to system fonts — a
            # visual regression nothing else would catch.
            $fonts = @(Get-ChildItem 'out\_next\static\media' -Filter *.woff2 -ErrorAction SilentlyContinue)
            if ($fonts.Count -lt 1) { throw 'No .woff2 emitted — next/font did not run.' }

            # Structured data is the backbone of the SEO work; a bad refactor
            # could drop it without breaking the build.
            $html = Get-Content 'out\index.html' -Raw
            $ld = ([regex]'application/ld\+json').Matches($html).Count
            if ($ld -lt 4) { throw "Expected 4+ JSON-LD blocks, found $ld." }

            Write-Host "OK - $($fonts.Count) fonts, $ld JSON-LD blocks" -ForegroundColor Green

      # ── web.config ─────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: Write web.config
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'

            # Only emit the rewrite rule if the URL Rewrite module is actually
            # installed. Referencing <rewrite> without it makes IIS return
            # HTTP 500.19 for every request — worse than having no redirect.
            $hasRewrite = Test-Path "$env:SystemRoot\System32\inetsrv\rewrite.dll"
            if (-not $hasRewrite) {
              Write-Host "##vso[task.logissue type=warning]URL Rewrite module not found - HTTP to HTTPS redirect skipped. Install from https://www.iis.net/downloads/microsoft/url-rewrite"
            }

            $rewrite = if ($hasRewrite) { @'
                <rewrite>
                  <rules>
                    <rule name="Redirect to HTTPS" stopProcessing="true">
                      <match url="(.*)" />
                      <conditions>
                        <add input="{HTTPS}" pattern="^OFF$" />
                      </conditions>
                      <action type="Redirect" url="https://{HTTP_HOST}/{R:1}" redirectType="Permanent" />
                    </rule>
                  </rules>
                </rewrite>
'@ } else { '' }

            # Single-page static export. No SPA rewrite-to-index: unknown URLs
            # must reach the exported 404, not silently render the home page.
            #
            # Every mimeMap is preceded by <remove> — a duplicate entry makes
            # IIS throw 500.19, and .woff2/.svg presence varies by IIS version.
            # Without the .woff2 map the fonts 404 and the typography falls back.
            $cfg = @"
            <?xml version="1.0" encoding="utf-8"?>
            <configuration>
              <system.webServer>
            $rewrite
                <httpErrors errorMode="Custom" existingResponse="Replace">
                  <remove statusCode="404" />
                  <error statusCode="404" path="/404.html" responseMode="ExecuteURL" />
                </httpErrors>
                <staticContent>
                  <remove fileExtension=".woff2" />
                  <mimeMap fileExtension=".woff2" mimeType="font/woff2" />
                  <remove fileExtension=".woff" />
                  <mimeMap fileExtension=".woff" mimeType="font/woff" />
                  <remove fileExtension=".svg" />
                  <mimeMap fileExtension=".svg" mimeType="image/svg+xml" />
                  <remove fileExtension=".json" />
                  <mimeMap fileExtension=".json" mimeType="application/json" />
                  <remove fileExtension=".webmanifest" />
                  <mimeMap fileExtension=".webmanifest" mimeType="application/manifest+json" />
                </staticContent>
                <httpProtocol>
                  <customHeaders>
                    <add name="X-Content-Type-Options" value="nosniff" />
                    <add name="Referrer-Policy" value="strict-origin-when-cross-origin" />
                    <add name="Strict-Transport-Security" value="max-age=31536000; includeSubDomains" />
                  </customHeaders>
                </httpProtocol>
              </system.webServer>
              <!-- Content-hashed bundles only. Everything else keeps IIS defaults
                   so HTML and og.png stay revalidated. -->
              <location path="_next/static">
                <system.webServer>
                  <staticContent>
                    <clientCache cacheControlMode="UseMaxAge" cacheControlMaxAge="365.00:00:00" />
                  </staticContent>
                </system.webServer>
              </location>
            </configuration>
            "@

            $cfg | Out-File "$(workingDir)\out\web.config" -Encoding utf8

            # Fail now rather than let IIS discover it is malformed.
            [xml](Get-Content "$(workingDir)\out\web.config") | Out-Null
            Write-Host "web.config written and parsed OK (rewrite: $hasRewrite)" -ForegroundColor Green

      # ── Deploy ─────────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: Deploy to IIS
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Continue'   # robocopy uses non-zero for success

            if (-not (Test-Path '$(deployPath)')) {
              New-Item -ItemType Directory -Path '$(deployPath)' -Force | Out-Null
            }

            # /R and /W are load-bearing. robocopy defaults to /R:1000000 /W:30 —
            # a single file locked by IIS would retry a million times at 30s
            # intervals and hang the agent effectively forever.
            #
            # /XF excludes the uncropped source photo and the editable resume:
            # both sit in public/ but are not linked from the site, and there is
            # no reason to publish them.
            robocopy '$(workingDir)\out' '$(deployPath)' /MIR /R:2 /W:5 /NFL /NDL /NJH /NJS /NP `
              /XF pic.jpeg ResumeSrinivasMP2026Detailed.docx
            $rc = $LASTEXITCODE

            # Exit codes are a bit field: 0-7 informational, 8+ real failures.
            if ($rc -ge 8) {
              Write-Host "##vso[task.logissue type=error]robocopy failed with code $rc"
              exit $rc
            }

            Write-Host "Deployed to $(deployPath) (robocopy code $rc)" -ForegroundColor Green
            exit 0

      # ── Smoke test ─────────────────────────────────────────────────────
      - task: PowerShell@2
        displayName: Smoke test live site
        inputs:
          targetType: inline
          script: |
            $ErrorActionPreference = 'Stop'
            Start-Sleep -Seconds 3

            $r = Invoke-WebRequest -Uri '$(siteUrl)' -UseBasicParsing -TimeoutSec 20
            if ($r.StatusCode -ne 200) { throw "Home page returned $($r.StatusCode)" }
            if ($r.Content -notmatch 'Pillalamarri') { throw 'Home page served but content looks wrong.' }

            foreach ($p in @('/robots.txt', '/sitemap.xml', '/og.png', '/llms.txt')) {
              $u = '$(siteUrl)' + $p
              try {
                $x = Invoke-WebRequest -Uri $u -UseBasicParsing -TimeoutSec 15
                Write-Host ("  {0,-16} {1}  {2}" -f $p, $x.StatusCode, $x.Headers['Content-Type'])
              } catch {
                throw "$p failed: $_"
              }
            }

            # The whole point of the redirect rule — verify it actually fires.
            try {
              $h = Invoke-WebRequest -Uri 'http://srinivasmp.com' -UseBasicParsing `
                     -MaximumRedirection 0 -ErrorAction SilentlyContinue
              if ($h.StatusCode -eq 200) {
                Write-Host "##vso[task.logissue type=warning]http:// still returns 200 - HTTPS redirect is not active."
              }
            } catch {
              Write-Host "  http -> redirects (as expected)"
            }

            Write-Host "Smoke test passed" -ForegroundColor Green
